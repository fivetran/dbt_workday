version: 1.0.4-a2
pr_number: 45
schema_data_changes:
  entries:
  - models:
    - stg_workday__worker_history
    - stg_workday__personal_information_history
    - stg_workday__worker_position_history
    - stg_workday__worker_position_organization_history
    change_type: New field
    new: as_of_effective_date
    is_breaking: false
    notes: Workday's Optimized History Mode can write more than one row for the same
      record and `_fivetran_start`. These models now keep the row with the latest
      `as_of_effective_date` for each record and `_fivetran_start` before generating
      `history_unique_key`. This preserves one row per `_fivetran_start`.
  - models:
    - stg_workday__worker
    - stg_workday__worker_position
    - stg_workday__worker_position_organization
    change_type: Data change
    old: Selected every record active at the current timestamp.
    new: Selects the record with the latest `as_of_effective_date` among the records
      active at the current timestamp.
    is_breaking: false
    notes: Preventive change for Workday's Optimized History Mode. It has no effect
      on connections that don't sync `as_of_effective_date`.
bug_fixes:
- title: Daily history models stop at a limit in the future
  description: Fixes run timeouts in `workday__employee_daily_history` and `workday__worker_position_org_daily_history`
    when a history table has a far-future `_fivetran_start`, such as a mistyped effective
    date in the year 5202. The daily models now ignore start dates more than 12 months
    past today when deciding where to end, so future-dated records like upcoming hires
    still appear.
  details:
  - Adds the `employee_history_future_months` variable (default 12) to set how many
    months past today a start date can be before the daily models ignore it. In Quickstart,
    set it with **Employee History Future Months**.
under_the_hood:
- description: Adds the `get_employee_history_spine_bounds` macro, which `workday__employee_daily_history`
    and `workday__worker_position_org_daily_history` use to find the first and last
    dates of their date spine. It replaces the duplicated query in each model.
date: '2026-11-18'
