version: 1.1.0
pr_number: 43
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- title: Column documentation parity for the employee history models
  description: Updates the column documentation in `workday__employee_daily_history`
    and `workday__worker_position_org_daily_history` so it matches the columns the
    models output. No model logic or output changes.
  details:
  - Documents 18 personal information fields in `workday__employee_daily_history`
    that the model already outputs, including `marital_status`, `primary_nationality`,
    `religion`, and `political_affiliation`.
  - Removes the stale `active` and `effective_date` entries, which the model outputs
    as `is_active` and `position_effective_date`.
  - Removes the stale `wh_end_employment_date`, `wph_end_employment_date`, `wh_pay_through_date`,
    and `wph_pay_through_date` entries, which the model consolidates into `end_employment_date`
    and `pay_through_date`.
  - Removes the stale `_fivetran_synced` entry from `workday__worker_position_org_daily_history`,
    which the model no longer outputs.
