version: 1.0.4-a1
pr_number: 39
schema_data_changes:
  entries:
  - models:
    - stg_workday__worker_history
    - stg_workday__personal_information_history
    - stg_workday__worker_position_history
    - stg_workday__worker_position_organization_history
    change_type: New field
    new: as_of_effective_date
    is_breaking: false
    notes: Workday's Optimized History Mode can write more than one row for the same
      record and `_fivetran_start`. These models now keep the row with the latest
      `as_of_effective_date` for each record and `_fivetran_start` before generating
      `history_unique_key`. This preserves one row per `_fivetran_start`.
  - models:
    - stg_workday__worker
    - stg_workday__worker_position
    - stg_workday__worker_position_organization
    change_type: Data change
    old: Selected every record active at the current timestamp.
    new: Selects the record with the latest `as_of_effective_date` among the records
      active at the current timestamp.
    is_breaking: false
    notes: Preventive change for Workday's Optimized History Mode. It has no effect
      on connections that don't sync `as_of_effective_date`.
date: '2026-11-12'
